<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lesson Plan Assistant</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Lesson Plan" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #0a0a0a; }
    }

    /* Full-viewport iframe holding the Apps Script app */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      display: block;
      background: #f4f6f8;
    }
    @media (prefers-color-scheme: dark) {
      #app-frame { background: #0a0a0a; }
    }

    /* Loading splash while the iframe warms up */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #splash .dot {
      width: 10px; height: 10px;
      background: white;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.2s infinite;
    }
    #splash .dots { display: flex; gap: 6px; }
    #splash .dot:nth-child(2) { animation-delay: 0.15s; }
    #splash .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="inner">
      <div>✴ Loading…</div>
      <div class="dots">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbxzVgjwJg_woJZXj84hFquBzmqvFJiGe4Cap3AETZqjWR5tQW9F4SvjNbFr32VG06S-0A/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
    title="Lesson Plan Assistant"
  ></iframe>

  <script>
    // Register service worker for installability
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          // Silent — the app still works without offline support
        });
      });
    }

    // Hide splash once iframe is loaded
    var frame = document.getElementById('app-frame');
    var splash = document.getElementById('splash');
    frame.addEventListener('load', function () {
      setTimeout(function () { splash.classList.add('hide'); }, 200);
    });
    // Safety: hide splash after 4s even if load event misfires
    setTimeout(function () { splash.classList.add('hide'); }, 4000);
  </script>
</body>
</html>
